name: pmis
description: "Pmis project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# of the product and file versions while build-number is used as the build suffix.
version: 1.0.2+7

environment:
  sdk: ^3.6.1


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  url_launcher: ^6.2.2
  logger: ^2.0.2+1
  intl: ^0.19.0
# icons packages

  iconsax: ^0.0.8
  # State management Get
  get: ^4.6.6
  get_storage: ^2.1.1

  # Page indicating
  flutter_native_splash: ^2.4.4
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0
  lucide_icons: ^0.257.0

  # Product specific


  # loading
  lottie: ^3.0.0
  connectivity_plus: ^6.1.1
  shimmer: ^3.0.0
  image_picker: ^1.0.7
  firebase_storage: ^12.2.0
  cached_network_image: ^3.3.1
  ffi: ^2.1.0
  photo_view: ^0.15.0
  permission_handler: ^11.3.1
  hugeicons: ^0.0.10
  fl_chart: ^0.70.2
  flutter_staggered_grid_view: ^0.7.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  toastification: ^3.0.3
  package_info_plus: ^9.0.0
  google_fonts: ^8.1.0
  multi_select_flutter: ^4.1.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  remove_alpha_ios: true
  image_path: "assets/logos/logo.png"
  adaptive_icon_foreground: "assets/logos/logo.png"
  adaptive_icon_background: "#156f89"

flutter:

  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/logos/
    # - assets/icons/brands/
    - assets/images/onboardingscreen/
    - assets/images/animations/
    - assets/images/users/
    - assets/images/success/
    - assets/images/loading/

  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 700
       
  


